[project]
name = "budget-api"
version = "0.1.0"
description = "Budget Tracker backend API"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax, f-strings
    "SIM",     # simplifications
    "RUF",     # ruff-specific checks
    "N",       # PEP 8 naming
    "S",       # bandit: security, e.g. SQL built from strings
    "D",       # docstrings
    "PTH",     # pathlib instead of os.path
    "BLE",     # no blind except
    "T20",     # no print()
    "LOG",     # logging misuse
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"migrations/**" = ["D"]

[tool.mypy]
strict = true
files = ["app", "migrations", "scripts", "tests"]
mypy_path = "scripts"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
extraPaths = ["scripts"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.poe.tasks.check]
help = "Run every quality gate: lint, then test"
sequence = ["lint", "test"]

[tool.poe.tasks.lint]
help = "Check linting, formatting and types (ruff, mypy)"
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "mypy" },
]
ignore_fail = "return_non_zero"

[tool.poe.tasks.format]
help = "Fix auto-fixable lint issues, then format the code"
sequence = [
    { cmd = "ruff check --fix ." },
    { cmd = "ruff format ." },
]

[tool.poe.tasks.test]
help = "Run the tests with coverage; extra arguments go to pytest"
cmd = "pytest --cov"

[tool.poe.tasks.migrate]
help = "Run Alembic, by default `upgrade head`; e.g. `poe migrate downgrade -1`"
cmd = "alembic ${ALEMBIC_ARGS}"
args = [{ name = "ALEMBIC_ARGS", positional = true, multiple = true, default = "upgrade head" }]

[tool.poe.tasks.dev]
help = "Run the API locally with auto-reload, outside Docker"
shell = "APP_BUILD=$(python scripts/build_label.py) uvicorn --factory app.main:create_app --reload --host 127.0.0.1 --port 8000"

[tool.poe.tasks.build-label]
help = "Print the build label for the current commit, e.g. 0.2.0-dev.47+1a2b3c4"
cmd = "python scripts/build_label.py"
